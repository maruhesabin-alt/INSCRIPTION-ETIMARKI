<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulaire — COLLECT PRO</title>
<!-- Pour héberger cette page ailleurs que sur le serveur, décommentez et indiquez l'URL de l'API :
<meta name="api-base" content="https://votre-serveur.com/api/v1"> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
body{background:radial-gradient(900px 400px at 80% -10%,#cfd9ff,transparent),var(--bg);min-height:100vh;display:grid;place-items:start center;padding:28px 14px}
main{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,32px);box-shadow:0 20px 50px #0b153014;animation:rise .6s var(--ease) both}
h1{font-size:clamp(24px,5vw,32px);margin:0 0 6px}.mut{color:var(--mut);margin:0 0 8px}
label{display:block;font-weight:600;margin:14px 0 4px}label.i{display:flex;gap:9px;align-items:center;font-weight:400;margin:6px 0}label.i input{width:auto;accent-color:var(--blue)}
fieldset{border:0;padding:0;margin:14px 0 0}legend{font-weight:600;margin-bottom:2px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px #2f5bff22;outline:0}
.btn{margin-top:20px;width:100%;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:700;cursor:pointer;transition:transform .15s,background .2s}
.btn:hover{background:#1f46d8}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6;cursor:wait}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
#err{color:var(--err);font-weight:600;margin-top:12px;min-height:1px}
.ok{text-align:center;padding:20px 0}.tick{width:64px;height:64px;border-radius:50%;background:#e1f5ed;margin:0 auto 14px;position:relative;animation:pop .5s var(--ease) both}
.tick::after{content:"";position:absolute;left:21px;top:13px;width:14px;height:26px;border:solid var(--ok);border-width:0 5px 5px 0;transform:rotate(45deg);animation:draw .5s .2s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}@keyframes pop{from{transform:scale(.4);opacity:0}}@keyframes draw{from{clip-path:inset(0 100% 100% 0)}to{clip-path:inset(0)}}
</style>
</head>
<body>
<main id="root" aria-live="polite"><p class="mut">Chargement du formulaire…</p></main>
<script src="form.js"></script>
</body>
</html>
